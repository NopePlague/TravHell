<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravHell</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://static.vecteezy.com/system/resources/thumbnails/058/272/454/small/vibrant-3d-rendering-of-planet-earth-showcasing-continents-and-oceans-png.png" />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body id="body-dark">

  <nav>
    <div class="logo">TravHell 👾</div>
    <div class="nav-right">
      <button class="fav-nav-btn" onclick="toggleFavPanel()">
        ♥ Saved <span id="favCount" class="fav-count">0</span>
      </button>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌿 Nature</button>
    </div>
  </nav>

  <div class="hero">
    <p class="hero-tag">👻 Local spots. Hidden gems. Real adventures.</p>
    <h1 class="hero-title">Discover Places<br><span class="hero-accent">Only Locals Know</span></h1>
    <p class="hero-sub">Skip the tourist traps. Find hidden viewpoints, secret dhabas, and offbeat spots that never make it to travel guides.</p>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, city or category..." oninput="handleSearch()" />
    </div>
  </div>

  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('natural', this)">🌿 Nature</button>
      <button class="filter-btn" onclick="setFilter('cultural', this)">🎭 Culture</button>
      <button class="filter-btn" onclick="setFilter('historic', this)">🏛️ Historic</button>
      <button class="filter-btn" onclick="setFilter('religion', this)">🕌 Religious</button>
      <button class="filter-btn" onclick="setFilter('sport', this)">⚽ Sport</button>
      <button class="filter-btn" onclick="setFilter('tourism', this)">📍 Tourism</button>
    </div>
    <select id="sortSelect" class="sort-select" onchange="applySortFilter()">
      <option value="default">Sort: Default</option>
      <option value="name_asc">Name A → Z</option>
      <option value="name_desc">Name Z → A</option>
    </select>
  </div>

  <p class="result-info" id="resultInfo"></p>

  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <p>Haunting hidden gems...</p>
  </div>

  <div id="places" class="grid"></div>

  <div id="pagination" class="pagination"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="document.getElementById('modal').classList.add('hidden')">✕</button>
      <img id="modal-img" alt="place" />
      <div class="modal-body">
        <h2 id="modal-name"></h2>
        <p id="modal-location"></p>
        <div id="modal-categories" class="modal-cats"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleFavPanel()"></div>
  <div class="fav-panel" id="favPanel">
    <div class="fav-header">
      <h3>♥ Saved Places</h3>
      <button onclick="toggleFavPanel()" class="fav-close">✕</button>
    </div>
    <div id="favList" class="fav-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
